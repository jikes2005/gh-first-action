AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PoC - RAG with Amazon Bedrock Knowledge Base over documents in S3. Vector store is selectable:
  Aurora PostgreSQL Serverless v2 + pgvector (default, hybrid search) or Amazon S3 Vectors.
  Deploys into an existing VPC that already has Bedrock VPC endpoints.
  S3 -> EventBridge -> SQS -> Sync Lambda -> KB ingestion -> vector store.
  Query Lambda uses Retrieve / RetrieveAndGenerate with a Bedrock model.

Parameters:
  ProjectName:
    Type: String
    Default: kb-poc
    AllowedPattern: "^[a-z][a-z0-9-]{2,19}$"
    Description: Lowercase prefix for resource names (3-20 chars, starts with a letter).

  DocsPrefix:
    Type: String
    Default: kb/
    Description: S3 prefix that the Knowledge Base ingests (must end with /).

  # ----- Vector store -----
  VectorStore:
    Type: String
    Default: PGVECTOR
    AllowedValues: [PGVECTOR, S3_VECTORS]
    Description: >
      PGVECTOR = Aurora PostgreSQL Serverless v2 with pgvector in your VPC (primary flow, hybrid search).
      S3_VECTORS = Amazon S3 Vectors (lowest cost, semantic search only). Changing this replaces the KB.

  AuroraEngineVersion:
    Type: String
    Default: "16.6"
    Description: >
      Aurora PostgreSQL version (16.1+ / 15.4+ for pgvector HNSW + Data API). Check availability with:
      aws rds describe-db-engine-versions --engine aurora-postgresql --query 'DBEngineVersions[].EngineVersion'

  AuroraMinCapacity:
    Type: Number
    Default: 0.5
    AllowedValues: [0.5, 1, 2, 4]
    Description: Serverless v2 minimum ACUs. 0.5 keeps the DB warm (auto-pause to 0 is avoided - cold starts time out Bedrock calls).

  AuroraMaxCapacity:
    Type: Number
    Default: 4
    AllowedValues: [1, 2, 4, 8, 16, 32]
    Description: Serverless v2 maximum ACUs.

  # ----- Models & chunking -----
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model ID (must be enabled in this account/region).

  EmbeddingDimensions:
    Type: Number
    Default: 1024
    AllowedValues: [256, 512, 1024]
    Description: Vector dimensions for Titan Text Embeddings V2 (also the pgvector column / S3 Vectors index dimension).

  GenerationModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: >
      Model or cross-region inference profile ID used to generate answers
      (e.g. us.anthropic..., eu.anthropic..., global.anthropic...). Must be enabled in Bedrock.

  ChunkMaxTokens:
    Type: Number
    Default: 400
    MinValue: 20
    MaxValue: 8192

  ChunkOverlapPercentage:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 99

  SyncBatchWindowSeconds:
    Type: Number
    Default: 60
    MinValue: 0
    MaxValue: 300
    Description: How long S3 change events are batched before an ingestion job is started.

  # ----- Networking (existing VPC + existing Bedrock endpoints) -----
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the Lambdas (DNS support + DNS hostnames enabled).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more existing private subnets (different AZs) in that VPC.

  BedrockEndpointSecurityGroupId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^sg-[0-9a-z]+$"
    Description: >
      Optional. Security group attached to your existing Bedrock VPC endpoints
      (bedrock-agent, bedrock-agent-runtime). If set, the stack adds an HTTPS ingress rule
      from the Lambda security group. Leave empty if they already allow HTTPS from these subnets.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: General }
        Parameters: [ProjectName, DocsPrefix]
      - Label: { default: Networking (existing VPC and Bedrock endpoints) }
        Parameters: [VpcId, SubnetIds, BedrockEndpointSecurityGroupId]
      - Label: { default: Vector store }
        Parameters: [VectorStore, AuroraEngineVersion, AuroraMinCapacity, AuroraMaxCapacity]
      - Label: { default: Models & chunking }
        Parameters: [EmbeddingModelId, EmbeddingDimensions, GenerationModelId, ChunkMaxTokens, ChunkOverlapPercentage, SyncBatchWindowSeconds]

Rules:
  # Fail fast (before any resource is created) if a subnet is not in the chosen VPC.
  SubnetsMustBelongToVpc:
    Assertions:
      - Assert: !EachMemberEquals [!ValueOfAll ["AWS::EC2::Subnet::Id", VpcId], !Ref VpcId]
        AssertDescription: >-
          All SubnetIds must belong to the VPC given in VpcId. Check with:
          aws ec2 describe-subnets --subnet-ids <ids> --query 'Subnets[].[SubnetId,VpcId]'

Conditions:
  AddBedrockEndpointIngress: !Not [!Equals [!Ref BedrockEndpointSecurityGroupId, ""]]
  UsePgVector: !Equals [!Ref VectorStore, PGVECTOR]
  UseS3Vectors: !Equals [!Ref VectorStore, S3_VECTORS]

Mappings:
  PgVector:
    Names:
      Database: bedrockkb
      Schema: bedrock_integration
      Table: bedrock_integration.bedrock_kb
      PrimaryKeyField: id
      VectorField: embedding
      TextField: chunks
      MetadataField: metadata
      CustomMetadataField: custom_metadata

Resources:
  # ---------------------------------------------------------------------------
  # Network: security groups in the existing VPC
  # ---------------------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: KB PoC Lambdas - HTTPS egress only (Bedrock via VPC endpoints)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-lambda-sg" }]

  # Let the Lambdas reach your EXISTING Bedrock interface endpoints
  BedrockEndpointIngressFromLambdas:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AddBedrockEndpointIngress
    Properties:
      GroupId: !Ref BedrockEndpointSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: !Sub "HTTPS from ${ProjectName} Lambdas"

  # ---------------------------------------------------------------------------
  # Customer-managed KMS key used by every resource that supports it
  # ---------------------------------------------------------------------------
  KmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ProjectName} - Bedrock KB PoC (S3, Aurora, Secrets Manager, S3 Vectors, KB ingestion, sessions, SQS, Lambda, Logs)"
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Account admins + IAM policies (roles below are granted access via their IAM policies)
          - Sid: EnableIamPolicies
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"
          # S3 Vectors background index maintenance
          - Sid: AllowS3VectorsIndexing
            Effect: Allow
            Principal: { Service: indexing.s3vectors.amazonaws.com }
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/*"
              ForAnyValue:StringEquals:
                kms:EncryptionContextKeys: ["aws:s3vectors:arn", "aws:s3vectors:resource-id"]
          # Bedrock encrypts RetrieveAndGenerate session context with this key
          - Sid: AllowBedrockSessionEncryption
            Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          # EventBridge sends to the KMS-encrypted SQS queue
          - Sid: AllowEventBridgeToEncryptedSqs
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          # CloudWatch Logs encrypts this stack's Lambda log groups
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: [kms:Encrypt*, kms:Decrypt*, kms:ReEncrypt*, kms:GenerateDataKey*, kms:Describe*]
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  KmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-kb"
      TargetKeyId: !Ref KmsKey

  # ---------------------------------------------------------------------------
  # Source documents
  # ---------------------------------------------------------------------------
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-docs-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt KmsKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocsBucket.Arn
              - !Sub "${DocsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # Objects may only be written with SSE-KMS using this stack's key
          # (uploads without an encryption header get it via default encryption).
          - Sid: DenyNonKmsEncryption
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${DocsBucket.Arn}/*"
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyOtherKmsKeys
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${DocsBucket.Arn}/*"
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt KmsKey.Arn

  # ---------------------------------------------------------------------------
  # Vector store option A (PRIMARY): Aurora PostgreSQL Serverless v2 + pgvector
  # ---------------------------------------------------------------------------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: UsePgVector
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} Aurora pgvector (existing private subnets)"
      SubnetIds: !Ref SubnetIds

  # Bedrock and the schema-init Lambda use the RDS Data API (HTTPS, IAM + Secrets Manager),
  # so no inbound database access is required. Add ingress later only if apps need direct SQL.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UsePgVector
    Properties:
      GroupDescription: Aurora pgvector cluster - no inbound (accessed via RDS Data API)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: No egress needed
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-aurora-sg" }]

  # Credentials Bedrock uses to read/write vectors (least-privilege DB role, not the master user)
  BedrockDbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UsePgVector
    Properties:
      Description: Aurora pgvector credentials used by the Bedrock Knowledge Base
      KmsKeyId: !GetAtt KmsKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username":"bedrock_user"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Condition: UsePgVector
    DeletionPolicy: Delete          # PoC: no final snapshot. Use Snapshot for anything real.
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub "${ProjectName}-pgvector"
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      DatabaseName: !FindInMap [PgVector, Names, Database]
      MasterUsername: kbadmin
      ManageMasterUserPassword: true          # master password lives in Secrets Manager (RDS-managed)
      MasterUserSecret:
        KmsKeyId: !GetAtt KmsKey.Arn
      EnableHttpEndpoint: true                # RDS Data API - required by Bedrock KB
      StorageEncrypted: true
      KmsKeyId: !GetAtt KmsKey.Arn
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref AuroraMinCapacity
        MaxCapacity: !Ref AuroraMaxCapacity
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: false

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Condition: UsePgVector
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-pgvector-1"
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true

  # Custom resource: create extension, schema, bedrock_user role, table and indexes via the
  # RDS Data API. Runs outside the VPC (Data API is an HTTPS AWS API), so no NAT is needed.
  PgSchemaInitRole:
    Type: AWS::IAM::Role
    Condition: UsePgVector
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: schema-init
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [rds-data:ExecuteStatement, rds-data:BatchExecuteStatement]
                Resource: !GetAtt AuroraCluster.DBClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt AuroraCluster.MasterUserSecret.SecretArn
                  - !Ref BedrockDbSecret
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !GetAtt KmsKey.Arn

  PgSchemaInitLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UsePgVector
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-pg-schema-init"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  PgSchemaInitFunction:
    Type: AWS::Lambda::Function
    Condition: UsePgVector
    DependsOn: [PgSchemaInitLogGroup, AuroraInstance]
    Properties:
      FunctionName: !Sub "${ProjectName}-pg-schema-init"
      Description: Creates the pgvector schema, bedrock_user role, table and indexes for the Bedrock KB
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt PgSchemaInitRole.Arn
      KmsKeyArn: !GetAtt KmsKey.Arn
      Code:
        ZipFile: |
          import json, time, threading, urllib.request
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          SUCCESS, FAILED = "SUCCESS", "FAILED"

          def send_cfn_response(event, context, status, data, physical_id, reason=None):
              """Minimal replacement for cfnresponse (no external module needed)."""
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_group_name} / {context.log_stream_name}",
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"Content-Type": "", "Content-Length": str(len(body))})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          print(f"CloudFormation response sent: {status} (HTTP {r.status})")
                          return
                  except Exception as e:
                      print(f"Failed to send CloudFormation response (attempt {attempt}): {e}")
                      time.sleep(2)

          # Fail fast on hung calls instead of letting the Lambda time out silently.
          CFG = Config(connect_timeout=5, read_timeout=50, retries={"max_attempts": 2, "mode": "standard"})
          rds = boto3.client("rds-data", config=CFG)
          sm = boto3.client("secretsmanager", config=CFG)

          TRANSIENT_CODES = {"DatabaseResumingException", "DatabaseNotFoundException",
                             "DatabaseUnavailableException", "ServiceUnavailableError",
                             "StatementTimeoutException", "InternalServerErrorException"}

          class Deadline(Exception):
              pass

          def run(p, sql, ctx):
              attempt = 0
              while True:
                  if ctx.get_remaining_time_in_millis() < 90_000:
                      raise Deadline("Out of time waiting for Aurora Data API (see earlier log lines)")
                  try:
                      return rds.execute_statement(resourceArn=p["ClusterArn"], secretArn=p["MasterSecretArn"],
                                                   database=p["Database"], sql=sql)
                  except ClientError as e:
                      code, msg = e.response["Error"]["Code"], e.response["Error"].get("Message", "")
                      transient = code in TRANSIENT_CODES or "Communications link failure" in msg \
                                  or "resuming" in msg.lower()
                      print(f"Data API error ({code}): {msg[:300]} | transient={transient} attempt={attempt}")
                      if not transient:
                          raise
                  except Exception as e:   # read/connect timeouts etc.
                      print(f"Data API call failed: {type(e).__name__}: {e} | attempt={attempt}")
                  attempt += 1
                  time.sleep(15)

          def setup(p, ctx):
              print(f"Connecting to {p['ClusterArn']} database={p['Database']}")
              pwd = json.loads(sm.get_secret_value(SecretId=p["BedrockSecretArn"])["SecretString"])["password"]
              schema, table, dim = p["Schema"], p["Table"], int(p["Dimension"])
              stmts = [
                  "SELECT 1",   # connectivity check
                  "CREATE EXTENSION IF NOT EXISTS vector",
                  f"CREATE SCHEMA IF NOT EXISTS {schema}",
                  # Create or rotate the least-privilege role Bedrock uses (password from Secrets Manager).
                  "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='bedrock_user') "
                  "THEN CREATE ROLE bedrock_user LOGIN; END IF; END $$",
                  f"ALTER ROLE bedrock_user WITH LOGIN PASSWORD '{pwd}'",
                  f"GRANT USAGE, CREATE ON SCHEMA {schema} TO bedrock_user",
                  f"CREATE TABLE IF NOT EXISTS {table} (id uuid PRIMARY KEY, embedding vector({dim}), "
                  "chunks text, metadata json, custom_metadata jsonb)",
                  # HNSW cosine index for semantic search
                  f"CREATE INDEX IF NOT EXISTS bedrock_kb_embedding_hnsw ON {table} "
                  "USING hnsw (embedding vector_cosine_ops) WITH (ef_construction = 256)",
                  # Full-text index on chunks -> enables HYBRID search in Bedrock
                  f"CREATE INDEX IF NOT EXISTS bedrock_kb_chunks_fts ON {table} "
                  "USING gin (to_tsvector('simple', chunks))",
                  # Metadata filtering
                  f"CREATE INDEX IF NOT EXISTS bedrock_kb_custom_metadata ON {table} USING gin (custom_metadata)",
                  f"GRANT SELECT, INSERT, UPDATE, DELETE ON {table} TO bedrock_user",
              ]
              for sql in stmts:
                  print("SQL:", sql.split(" PASSWORD ")[0] + (" PASSWORD '***'" if " PASSWORD " in sql else ""))
                  run(p, sql, ctx)
              ver = run(p, "SELECT extversion FROM pg_extension WHERE extname='vector'", ctx)
              print("pgvector version:", ver["records"][0][0].get("stringValue"))

          def handler(event, context):
              p = event["ResourceProperties"]
              phys = f"{p['ClusterArn']}/{p['Table']}"
              done = threading.Event()

              def respond(status, data=None, reason=None):
                  if done.is_set():
                      return
                  done.set()
                  send_cfn_response(event, context, status, data, phys, reason[:500] if reason else None)

              # Safety net: ALWAYS answer CloudFormation before Lambda kills us.
              guard = threading.Timer(max(context.get_remaining_time_in_millis() / 1000 - 20, 1),
                                      lambda: respond(FAILED,
                                                      reason="Timed out - check /aws/lambda/*-pg-schema-init logs"))
              guard.daemon = True
              guard.start()
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      setup(p, context)
                  # Delete: no-op - the table goes away with the cluster.
                  respond(SUCCESS, {"TableName": p["Table"]})
              except Exception as e:
                  print(f"ERROR: {type(e).__name__}: {e}")
                  respond(FAILED, reason=f"{type(e).__name__}: {e}")
              finally:
                  guard.cancel()

  PgSchema:
    Type: Custom::PgVectorSchema
    Condition: UsePgVector
    Properties:
      ServiceToken: !GetAtt PgSchemaInitFunction.Arn
      ServiceTimeout: 960      # fail the stack after 16 min instead of CloudFormation's 1-hour default
      ClusterArn: !GetAtt AuroraCluster.DBClusterArn
      MasterSecretArn: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
      BedrockSecretArn: !Ref BedrockDbSecret
      Database: !FindInMap [PgVector, Names, Database]
      Schema: !FindInMap [PgVector, Names, Schema]
      Table: !FindInMap [PgVector, Names, Table]
      Dimension: !Ref EmbeddingDimensions

  # ---------------------------------------------------------------------------
  # Vector store option B (kept for testing): Amazon S3 Vectors
  # ---------------------------------------------------------------------------
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Condition: UseS3Vectors
    Properties:
      VectorBucketName: !Sub "${ProjectName}-vectors-${AWS::AccountId}"
      # Immutable after creation; inherited by the index.
      EncryptionConfiguration:
        SseType: aws:kms
        KmsKeyArn: !GetAtt KmsKey.Arn

  VectorIndex:
    Type: AWS::S3Vectors::Index
    Condition: UseS3Vectors
    DependsOn: VectorBucket
    Properties:
      VectorBucketName: !Sub "${ProjectName}-vectors-${AWS::AccountId}"
      IndexName: !Sub "${ProjectName}-index"
      DataType: float32
      Dimension: !Ref EmbeddingDimensions
      DistanceMetric: cosine
      # Bedrock stores chunk text + metadata blobs in these keys. They exceed the
      # filterable-metadata size limit, so they MUST be non-filterable or ingestion fails.
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT
          - AMAZON_BEDROCK_METADATA

  # ---------------------------------------------------------------------------
  # Knowledge Base
  # ---------------------------------------------------------------------------
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-kb-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: kb-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EmbeddingModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
              - Sid: ReadDocsList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocsBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: ReadDocs
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DocsBucket.Arn}/${DocsPrefix}*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              # Decrypt SSE-KMS docs + DB secret, read/write KMS-encrypted vectors, encrypt transient ingestion data
              - Sid: KmsForKnowledgeBase
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt KmsKey.Arn
              - !If
                - UsePgVector
                - Sid: AuroraDataApi
                  Effect: Allow
                  Action: [rds:DescribeDBClusters, rds-data:ExecuteStatement, rds-data:BatchExecuteStatement]
                  Resource: !GetAtt AuroraCluster.DBClusterArn
                - !Ref AWS::NoValue
              - !If
                - UsePgVector
                - Sid: AuroraCredentials
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref BedrockDbSecret
                - !Ref AWS::NoValue
              - !If
                - UseS3Vectors
                - Sid: S3VectorsStore
                  Effect: Allow
                  Action:
                    - s3vectors:PutVectors
                    - s3vectors:GetVectors
                    - s3vectors:DeleteVectors
                    - s3vectors:QueryVectors
                    - s3vectors:ListVectors
                    - s3vectors:GetIndex
                  Resource: !Ref VectorIndex
                - !Ref AWS::NoValue

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub "${ProjectName}-kb"
      Description: !Sub "PoC knowledge base over S3 documents (${VectorStore} vector store)"
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: !Ref EmbeddingDimensions
      StorageConfiguration: !If
        - UsePgVector
        - Type: RDS
          RdsConfiguration:
            ResourceArn: !GetAtt AuroraCluster.DBClusterArn
            CredentialsSecretArn: !Ref BedrockDbSecret
            DatabaseName: !FindInMap [PgVector, Names, Database]
            TableName: !GetAtt PgSchema.TableName      # also makes the KB wait for schema init
            FieldMapping:
              PrimaryKeyField: !FindInMap [PgVector, Names, PrimaryKeyField]
              VectorField: !FindInMap [PgVector, Names, VectorField]
              TextField: !FindInMap [PgVector, Names, TextField]
              MetadataField: !FindInMap [PgVector, Names, MetadataField]
              CustomMetadataField: !FindInMap [PgVector, Names, CustomMetadataField]
        - Type: S3_VECTORS
          S3VectorsConfiguration:
            VectorBucketArn: !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ProjectName}-vectors-${AWS::AccountId}"
            IndexArn: !Ref VectorIndex

  DocsDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: !Sub "${ProjectName}-s3-docs"
      KnowledgeBaseId: !Ref KnowledgeBase
      DataDeletionPolicy: DELETE
      # Encrypts transient data while documents are parsed/chunked/embedded
      ServerSideEncryptionConfiguration:
        KmsKeyArn: !GetAtt KmsKey.Arn
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocsBucket.Arn
          InclusionPrefixes:
            - !Ref DocsPrefix
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: !Ref ChunkMaxTokens
            OverlapPercentage: !Ref ChunkOverlapPercentage

  # ---------------------------------------------------------------------------
  # Automatic sync: S3 events -> EventBridge -> SQS (batch/debounce) -> Lambda
  # ---------------------------------------------------------------------------
  SyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-sync-dlq"
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !GetAtt KmsKey.Arn
      KmsDataKeyReusePeriodSeconds: 3600

  SyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-sync"
      # If a job is already running the batch is retried after this visibility timeout.
      VisibilityTimeout: 300
      KmsMasterKeyId: !GetAtt KmsKey.Arn
      KmsDataKeyReusePeriodSeconds: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SyncDLQ.Arn
        maxReceiveCount: 30

  SyncQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref SyncQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SyncQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt DocsChangedRule.Arn

  DocsChangedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-docs-changed"
      Description: Forward document create/delete events under the KB prefix to the sync queue
      EventPattern:
        source: [aws.s3]
        detail-type: ["Object Created", "Object Deleted"]
        detail:
          bucket:
            name: [!Ref DocsBucket]
          object:
            key: [{ prefix: !Ref DocsPrefix }]
      Targets:
        - Id: sync-queue
          Arn: !GetAtt SyncQueue.Arn

  SyncFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
      Policies:
        - PolicyName: sync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:ListIngestionJobs
                  - bedrock:GetIngestionJob
                Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt SyncQueue.Arn
              - Sid: KmsDecrypt
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt KmsKey.Arn

  SyncFunction:
    Type: AWS::Lambda::Function
    DependsOn: SyncFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-kb-sync"
      Description: Starts a Bedrock KB ingestion job when documents change (one job at a time)
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Role: !GetAtt SyncFunctionRole.Arn
      KmsKeyArn: !GetAtt KmsKey.Arn
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          KB_ID: !Ref KnowledgeBase
          DS_ID: !GetAtt DocsDataSource.DataSourceId
      Code:
        ZipFile: |
          import os, json, boto3
          from botocore.exceptions import ClientError

          agent = boto3.client("bedrock-agent")
          KB_ID, DS_ID = os.environ["KB_ID"], os.environ["DS_ID"]
          BUSY = {"STARTING", "IN_PROGRESS", "STOPPING"}

          class JobAlreadyRunning(Exception):
              pass

          def running_job():
              resp = agent.list_ingestion_jobs(
                  knowledgeBaseId=KB_ID, dataSourceId=DS_ID,
                  sortBy={"attribute": "STARTED_AT", "order": "DESCENDING"}, maxResults=5)
              for j in resp.get("ingestionJobSummaries", []):
                  if j["status"] in BUSY:
                      return j["ingestionJobId"]
              return None

          def handler(event, context):
              keys = []
              for r in event.get("Records", []):
                  try:
                      keys.append(json.loads(r["body"])["detail"]["object"]["key"])
                  except Exception:
                      pass
              print(json.dumps({"changed_objects": len(keys), "sample": keys[:10]}))

              job = running_job()
              if job:
                  # Fail the batch -> SQS redelivers after the visibility timeout.
                  raise JobAlreadyRunning(f"Ingestion job {job} still running; will retry")
              try:
                  resp = agent.start_ingestion_job(
                      knowledgeBaseId=KB_ID, dataSourceId=DS_ID,
                      description=f"Auto-sync for {len(keys)} changed object(s)")
              except ClientError as e:
                  if e.response["Error"]["Code"] in ("ConflictException", "ThrottlingException"):
                      raise JobAlreadyRunning(str(e))
                  raise
              job_id = resp["ingestionJob"]["ingestionJobId"]
              print(json.dumps({"started_ingestion_job": job_id}))
              return {"ingestionJobId": job_id}

  SyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-kb-sync"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  SyncEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SyncQueue.Arn
      FunctionName: !Ref SyncFunction
      BatchSize: 1000
      MaximumBatchingWindowInSeconds: !Ref SyncBatchWindowSeconds
      # Concurrency is capped by ReservedConcurrentExecutions: 1 on SyncFunction.

  # ---------------------------------------------------------------------------
  # Query function (RAG)
  # ---------------------------------------------------------------------------
  QueryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
      Policies:
        - PolicyName: rag
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Retrieve
                Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
              - Sid: RetrieveAndGenerate
                Effect: Allow
                Action: bedrock:RetrieveAndGenerate
                Resource: "*"
              - Sid: GenerationModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                Resource:
                  # Cross-region inference profiles route to the foundation model in several regions.
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Sid: KmsDecrypt
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt KmsKey.Arn

  QueryFunction:
    Type: AWS::Lambda::Function
    DependsOn: QueryFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-kb-query"
      Description: RAG query over the Bedrock Knowledge Base
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt QueryFunctionRole.Arn
      KmsKeyArn: !GetAtt KmsKey.Arn
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          KB_ID: !Ref KnowledgeBase
          MODEL_ID: !Ref GenerationModelId
          ACCOUNT_ID: !Ref AWS::AccountId
          SESSION_KMS_KEY_ARN: !GetAtt KmsKey.Arn
          # pgvector supports HYBRID (thanks to the full-text index); S3 Vectors is semantic only.
          DEFAULT_SEARCH_TYPE: !If [UsePgVector, HYBRID, SEMANTIC]
      Code:
        ZipFile: |
          import os, json, re, boto3

          rt = boto3.client("bedrock-agent-runtime")
          KB_ID, MODEL_ID = os.environ["KB_ID"], os.environ["MODEL_ID"]
          REGION, ACCOUNT = os.environ["AWS_REGION"], os.environ["ACCOUNT_ID"]

          # Inference profile IDs start with a geo prefix (us., eu., apac., global., ...)
          if re.match(r"^[a-z]{2,6}\.", MODEL_ID) and not MODEL_ID.startswith(("amazon.", "anthropic.", "cohere.", "meta.", "mistral.")):
              MODEL_ARN = f"arn:aws:bedrock:{REGION}:{ACCOUNT}:inference-profile/{MODEL_ID}"
          else:
              MODEL_ARN = f"arn:aws:bedrock:{REGION}::foundation-model/{MODEL_ID}"

          PROMPT = (
              "You are a helpful assistant. Answer the user's question using ONLY the search results below. "
              "If the answer is not in the results, say you don't know. Be concise.\n\n"
              "Search results:\n$search_results$\n\n$output_format_instructions$"
          )

          def handler(event, context):
              # Accept direct invoke ({"question": ...}) or a Function URL / API GW body.
              if isinstance(event.get("body"), str):
                  event = json.loads(event["body"])
              q = event["question"]
              mode = event.get("mode", "rag")                     # "rag" | "retrieve"
              vcfg = {
                  "numberOfResults": int(event.get("numberOfResults", 5)),
                  # HYBRID (pgvector default) | SEMANTIC. S3 Vectors only supports SEMANTIC.
                  "overrideSearchType": event.get("searchType", os.environ["DEFAULT_SEARCH_TYPE"]),
              }
              if event.get("filter"):                             # Bedrock RetrievalFilter JSON
                  vcfg["filter"] = event["filter"]

              if mode == "retrieve":
                  resp = rt.retrieve(knowledgeBaseId=KB_ID,
                                     retrievalQuery={"text": q},
                                     retrievalConfiguration={"vectorSearchConfiguration": vcfg})
                  return {"results": [{
                      "score": r.get("score"),
                      "source": r["location"].get("s3Location", {}).get("uri"),
                      "metadata": r.get("metadata"),
                      "text": r["content"]["text"]} for r in resp["retrievalResults"]]}

              args = {
                  "input": {"text": q},
                  "retrieveAndGenerateConfiguration": {
                      "type": "KNOWLEDGE_BASE",
                      "knowledgeBaseConfiguration": {
                          "knowledgeBaseId": KB_ID,
                          "modelArn": MODEL_ARN,
                          "retrievalConfiguration": {"vectorSearchConfiguration": vcfg},
                          "generationConfiguration": {"promptTemplate": {"textPromptTemplate": PROMPT}},
                      },
                  },
              }
              if event.get("sessionId"):
                  args["sessionId"] = event["sessionId"]
              else:
                  # Session context (conversation memory) stored by Bedrock is encrypted with the CMK.
                  # Only allowed when creating a new session.
                  args["sessionConfiguration"] = {"kmsKeyArn": os.environ["SESSION_KMS_KEY_ARN"]}
              resp = rt.retrieve_and_generate(**args)

              sources = []
              for c in resp.get("citations", []):
                  for ref in c.get("retrievedReferences", []):
                      uri = ref["location"].get("s3Location", {}).get("uri")
                      if uri and uri not in sources:
                          sources.append(uri)
              return {"answer": resp["output"]["text"], "sources": sources, "sessionId": resp["sessionId"]}

  QueryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-kb-query"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

Outputs:
  DocsBucketName:
    Value: !Ref DocsBucket
    Description: Upload documents (and optional .metadata.json sidecars) under DocsPrefix
  DocsPrefix:
    Value: !Ref DocsPrefix
  KnowledgeBaseId:
    Value: !Ref KnowledgeBase
  DataSourceId:
    Value: !GetAtt DocsDataSource.DataSourceId
  QueryFunctionName:
    Value: !Ref QueryFunction
  SyncFunctionName:
    Value: !Ref SyncFunction
  VectorStore:
    Value: !Ref VectorStore
  AuroraClusterArn:
    Condition: UsePgVector
    Value: !GetAtt AuroraCluster.DBClusterArn
  AuroraMasterSecretArn:
    Condition: UsePgVector
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
    Description: Use with the RDS Query Editor / Data API to inspect the bedrock_kb table
  BedrockDbSecretArn:
    Condition: UsePgVector
    Value: !Ref BedrockDbSecret
  VectorIndexArn:
    Condition: UseS3Vectors
    Value: !Ref VectorIndex
  KmsKeyArn:
    Value: !GetAtt KmsKey.Arn
    Description: Uploaders need kms:GenerateDataKey on this key to put objects in the docs bucket
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Description: Allow HTTPS from this SG on your Bedrock endpoint security group
