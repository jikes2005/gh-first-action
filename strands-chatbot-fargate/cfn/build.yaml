AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Build pipeline for the Strands chatbot image - ECR repository plus a CodeBuild
  project that builds the ARM64 Docker image from a source zip in S3 (no local Docker needed).

Parameters:
  AppName:
    Type: String
    Default: strands-chatbot
    AllowedPattern: "[a-z][a-z0-9-]{1,30}"
  SourceBucket:
    Type: String
    Description: Existing S3 bucket where the notebook uploads the source zip

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AppName
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 10 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AppName}-build*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${SourceBucket}/${AppName}/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt Repository.Arn

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppName}-build
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/${AppName}/source.zip   # overridden per build by the notebook
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REPO_URI
            build:
              commands:
                - docker build -t $REPO_URI:$IMAGE_TAG .
            post_build:
              commands:
                - docker push $REPO_URI:$IMAGE_TAG
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true   # required for docker build
        EnvironmentVariables:
          - Name: REPO_URI
            Value: !GetAtt Repository.RepositoryUri
          - Name: IMAGE_TAG
            Value: latest
      TimeoutInMinutes: 20

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  BuildProjectName:
    Value: !Ref BuildProject
